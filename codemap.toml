# Architecture contract for `codemap check` (see docs/developer_guide/README.md, «Слои»).
# The same rules are enforced without codemap by tests/unit/test_layers_point_one_way.py.
[architecture]
# Ordered top → bottom. A layer may import only layers below it.
layers = ["__main__", "cli", "visualization", "analysis", "indicators", "data", "core"]

# Hard bans regardless of layering (the two edges G64 removed).
forbidden = [
  { from = "core", to = "analysis" },
  { from = "core", to = "indicators" },
  { from = "core", to = "data" },
  { from = "core", to = "visualization" },
  { from = "data", to = "indicators" },
  { from = "data", to = "analysis" },
  { from = "indicators", to = "analysis" },
  { from = "indicators", to = "visualization" },
]

# The eager import graph must be acyclic. On since codmap 0.0.14, which counts an import
# under `if TYPE_CHECKING:` as type-only rather than eager (codemap#18); before that the
# rule was red on a correct tree.
no_cycles = true

# The type-only graph must be acyclic too. The one pair that made it red — cache.py →
# pipeline for an annotation — was the dead twin of `ZoneAnalysisConfig.to_cache_key()`,
# removed 2026-09-07; nothing else needs an upward annotation.
no_type_only_cycles = true

# Lazy cycles (closed by a function-local import) are reported by `report architecture`;
# they are not gated: indicators.base ↔ custom.* register through the factory on purpose.
no_lazy_cycles = false

# Every core module's layer must be one of `layers` — a new top-level package must be declared.
exhaustive = true
